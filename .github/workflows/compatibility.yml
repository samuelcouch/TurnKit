name: RubyLLM compatibility

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        gemfile: [Gemfile, examples/interactive_validation/Gemfile.ruby_llm2]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: turnkit
          POSTGRES_PASSWORD: turnkit
          POSTGRES_DB: turnkit_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U turnkit -d turnkit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      BUNDLE_FROZEN: 'true'
      TURNKIT_TEST_DATABASE_URL: postgresql://turnkit:turnkit@localhost:5432/turnkit_test
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.10'
          bundler: '2.5.22'
          bundler-cache: true
      - run: bundle exec rake test
